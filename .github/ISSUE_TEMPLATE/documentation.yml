name: Documentation
description: Improve or fix documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        ## Documentation Update
        
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: What needs to be documented or fixed?
    validations:
      required: true
      
  - type: textarea
    id: current
    attributes:
      label: Current Documentation
      description: Link or paste the current docs if applicable
      placeholder: Link or paste here...
      
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Changes
      placeholder: Describe what should be changed or added...
    validations:
      required: true
