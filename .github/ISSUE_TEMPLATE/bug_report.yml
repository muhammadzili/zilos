name: Bug Report
description: Report something that is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        
        Describe the bug clearly. Include what you expected vs what happened.
        
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: A clear description of the bug...
    validations:
      required: true
      
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
      
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS/Platform: 
        - Compiler: 
        - QEMU version: 
        
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error messages or logs
      placeholder: Paste logs here...

  - type: checkboxes
    id: checkbox
    attributes:
      label: Confirmation
      options:
        - label: I have verified this bug exists
          required: true
